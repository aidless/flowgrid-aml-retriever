name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Zero-dependency unittest (fresh clone, no pytest)
        # Discovers the same tests/ tree. A class-level SkipTest on
        # TestDenseNomicIntegration prints one skip, so the "Ran" line is
        # four below the pytest collection count. tests/test_honesty_drift.py
        # locks the documented numbers to the loader count.
        run: python -m unittest discover -s tests -v
      - name: Pytest collection (canonical count)
        run: |
          python -m pip install pytest
          python -m pytest tests -q
